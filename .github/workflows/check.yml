name: CI

on:
  push:
  pull_request:

jobs:
  install:
    runs-on: ubuntu-latest
    container: ubuntu:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dotfiles
        run: ./install.sh

      - name: Check links
        run: |
          test -L "$HOME/.bashrc"
          test -L "$HOME/.claude/settings.json"
          test -L "$HOME/.claude/skills/security-audit/SKILL.md"

  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck
        run: shellcheck -S warning -x *.sh scripts/*/*.sh
